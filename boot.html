<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8ecf3; overflow: hidden;
  }
  /* ---- 背景光斑（液态漂浮） ---- */
  .glow { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; }
  .glow-a {
    width: 520px; height: 520px; left: -120px; top: -160px;
    background: radial-gradient(circle, rgba(77, 107, 254, .38), transparent 70%);
    animation: driftA 26s ease-in-out infinite alternate;
  }
  .glow-b {
    width: 460px; height: 460px; right: -140px; bottom: -180px;
    background: radial-gradient(circle, rgba(122, 92, 255, .32), transparent 70%);
    animation: driftB 32s ease-in-out infinite alternate;
  }
  @keyframes driftA { from { transform: translate(0, 0) scale(1); } to { transform: translate(90px, 70px) scale(1.15); } }
  @keyframes driftB { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-80px, -60px) scale(.95); } }

  /* ---- 液态玻璃卡片 ---- */
  .card {
    position: relative;
    max-width: 520px; width: 88%;
    border-radius: 26px;
    padding: 46px 44px 40px;
    text-align: center;
    cursor: default;
    transition: all .7s cubic-bezier(0.175, 0.885, 0.32, 2.2);
    isolation: isolate;
  }
  .glass {
    position: absolute; inset: 0; z-index: 0;
    border-radius: inherit; overflow: hidden;
    backdrop-filter: blur(6px) saturate(1.3);
    -webkit-backdrop-filter: blur(6px) saturate(1.3);
    transform: translateZ(0);
  }
  .glass::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: rgba(255, 255, 255, .08);
  }
  .glass::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    border: 1px solid rgba(255, 255, 255, .16);
    box-shadow: inset 1px 1px 0 0 rgba(255, 255, 255, .34),
                inset -1px -1px 0 0 rgba(255, 255, 255, .08),
                0 6px 6px rgba(0, 0, 0, .22), 0 0 20px rgba(0, 0, 0, .12);
  }
  .sheen {
    position: absolute; z-index: 1; pointer-events: none;
    width: 240px; height: 130px; left: 6%; top: -46px;
    background: radial-gradient(ellipse, rgba(255, 255, 255, .13), transparent 70%);
    transform: rotate(-12deg);
  }
  .content { position: relative; z-index: 10; }

  .badge {
    width: 68px; height: 68px; margin: 0 auto 20px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .10);
    backdrop-filter: blur(6px);
    box-shadow: inset 1px 1px 1px rgba(255,255,255,.4), inset -1px -1px 1px rgba(255,255,255,.1),
                0 8px 24px rgba(0, 0, 0, .35);
  }
  .badge img { width: 44px; height: 44px; }
  h1 { font-size: 21px; font-weight: 600; margin-bottom: 8px; letter-spacing: .3px; }
  .state { font-size: 13px; color: #aab3c2; margin-bottom: 22px; min-height: 18px; }

  .spinner {
    width: 36px; height: 36px; margin: 0 auto 18px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .14); border-top-color: #4d6bfe;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 玻璃进度条 ---- */
  .progress {
    display: none; width: 100%; height: 8px; margin: 0 auto 20px;
    border-radius: 99px; overflow: hidden;
    background: rgba(255, 255, 255, .10);
    box-shadow: inset 1px 1px 1px rgba(0, 0, 0, .25), inset -1px -1px 1px rgba(255, 255, 255, .12);
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4d6bfe, #7a5cff);
    border-radius: 99px;
    box-shadow: 0 0 12px rgba(77, 107, 254, .65);
    transition: width .25s ease;
  }

  .error {
    display: none; white-space: pre-wrap; font-size: 12px; color: #ffb3b3;
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 150, 150, .25);
    border-radius: 12px; padding: 12px 14px; text-align: left;
    margin-bottom: 18px; max-height: 200px; overflow: auto;
  }

  /* ---- 液态玻璃按钮 ---- */
  button {
    display: none; position: relative; overflow: hidden;
    background: rgba(255, 255, 255, .10); color: #fff; border: 0;
    border-radius: 14px; padding: 11px 34px; font-size: 14px; cursor: pointer;
    font-family: inherit; backdrop-filter: blur(4px);
    box-shadow: inset 1px 1px 1px rgba(255,255,255,.35), inset -1px -1px 1px rgba(255,255,255,.1),
                0 4px 10px rgba(0, 0, 0, .25);
    transition: all .7s cubic-bezier(0.175, 0.885, 0.32, 2.2);
  }
  button:hover {
    transform: scale(.94);
    background: rgba(255, 255, 255, .16);
    box-shadow: inset 2px 2px 1px rgba(255,255,255,.45), 0 8px 22px rgba(77, 107, 254, .35);
  }
  button:active { transform: scale(.9); }
  .meta { margin-top: 24px; font-size: 11px; color: #6d7686; }
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <div class="card" id="card">
    <div class="glass"></div>
    <div class="sheen"></div>
    <div class="content">
      <div class="badge"><img src="./icons/icon.png" alt="DSH" /></div>
      <h1>DeepSeek Harness</h1>
      <div class="state" id="state">正在启动 dsh 服务…</div>
      <div class="spinner" id="spinner"></div>
      <div class="progress" id="progressWrap"><div class="progress-fill" id="progressFill"></div></div>
      <div class="error" id="error"></div>
      <button id="retry">重试</button>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const payload = qs.get('state') ? JSON.parse(qs.get('state')) : { state: 'starting' };
    const stateEl = document.getElementById('state');
    const spinner = document.getElementById('spinner');
    const errorEl = document.getElementById('error');
    const retryBtn = document.getElementById('retry');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const card = document.getElementById('card');
    const apply = (p) => {
      if (p.state === 'error' || p.state === 'stopped') {
        spinner.style.display = 'none';
        progressWrap.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = p.message || '';
        retryBtn.style.display = 'inline-block';
        stateEl.textContent = p.state === 'stopped' ? '服务已停止' : '启动失败';
      } else if (p.state === 'downloading') {
        spinner.style.display = 'block';
        progressWrap.style.display = 'block';
        errorEl.style.display = 'none';
        retryBtn.style.display = 'none';
        stateEl.textContent = p.message || '正在下载运行依赖…';
        if (typeof p.progress === 'number') {
          progressFill.style.width = Math.max(0, Math.min(100, p.progress)) + '%';
        }
      } else if (p.state === 'ready') {
        stateEl.textContent = '已连接 ' + p.url;
        spinner.style.display = 'none';
        progressWrap.style.display = 'none';
        setTimeout(() => { card.style.transform = 'scale(.97)'; card.style.opacity = '0'; }, 150);
      } else {
        progressWrap.style.display = 'none';
        stateEl.textContent = p.message || '正在启动 dsh 服务…';
      }
    };
    apply(payload);
    retryBtn.addEventListener('click', () => window.dshDesktop && window.dshDesktop.action('retry'));
    window.dshDesktop && window.dshDesktop.onStatus(apply);
  </script>
</body>
</html>
